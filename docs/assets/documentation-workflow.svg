<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Documentation workflow</title>
  <desc id="desc">PM edits Markdown in Obsidian, creates a pull request, and developers review it.</desc>
  <rect width="960" height="420" fill="#f7f7f3"/>
  <rect x="70" y="120" width="190" height="120" rx="8" fill="#ffffff" stroke="#2f3a3f" stroke-width="3"/>
  <rect x="385" y="120" width="190" height="120" rx="8" fill="#ffffff" stroke="#2f3a3f" stroke-width="3"/>
  <rect x="700" y="120" width="190" height="120" rx="8" fill="#ffffff" stroke="#2f3a3f" stroke-width="3"/>
  <text x="165" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#192024">Obsidian</text>
  <text x="165" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#39464d">PM edits Markdown</text>
  <text x="480" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#192024">GitHub PR</text>
  <text x="480" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#39464d">Text and images</text>
  <text x="795" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#192024">Review</text>
  <text x="795" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#39464d">Developer merges</text>
  <path d="M275 180 H365" fill="none" stroke="#2d6cdf" stroke-width="5" stroke-linecap="round"/>
  <path d="M352 165 L372 180 L352 195" fill="none" stroke="#2d6cdf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M590 180 H680" fill="none" stroke="#2d6cdf" stroke-width="5" stroke-linecap="round"/>
  <path d="M667 165 L687 180 L667 195" fill="none" stroke="#2d6cdf" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#192024">Repository images stay versioned with the documentation.</text>
</svg>

